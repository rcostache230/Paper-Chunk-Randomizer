plugins {
    id 'java'
}

group = findProperty('plugin_group') ?: 'org.eckelsoft'
version = findProperty('plugin_version') ?: '0.1.0-beta.1'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${findProperty('paper_api_version')}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filesMatching('plugin.yml') {
        expand(
                version: project.version,
                apiVersion: findProperty('paper_api_compat_version') ?: '1.21.10'
        )
    }
}

tasks.jar {
    archiveBaseName = findProperty('archive_name') ?: 'Paper-Chunk-Randomizer'
}
