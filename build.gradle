import java.text.SimpleDateFormat
import java.util.TimeZone

plugins {
    id 'java'
}

def basePluginVersion = (findProperty('plugin_version') ?: '0.2.0').toString()
def buildTimestampFormat = new SimpleDateFormat("yyyyMMddHHmmss")
buildTimestampFormat.setTimeZone(TimeZone.getTimeZone("UTC"))
def buildTimestamp = buildTimestampFormat.format(new Date())

group = findProperty('plugin_group') ?: 'org.eckelsoft'
version = "${basePluginVersion}-build.${buildTimestamp}"

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${findProperty('paper_api_version')}"
    testImplementation "io.papermc.paper:paper-api:${findProperty('paper_api_version')}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.16.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filesMatching('plugin.yml') {
        expand(
                version: project.version,
                apiVersion: findProperty('paper_api_compat_version') ?: '1.21.11'
        )
    }
}

tasks.jar {
    archiveBaseName = findProperty('archive_name') ?: 'Paper-Chunk-Randomizer'
}

// A separate, disposable-server verification plugin. Never included in the release jar.
sourceSets {
    probe {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    }
}

tasks.register('probeJar', Jar) {
    dependsOn tasks.named('probeClasses')
    archiveBaseName = 'RandomizerVerification'
    archiveVersion = ''
    from sourceSets.probe.output
}
