name: Paper-Chunk-Randomizer
version: ${version}
main: org.eckelsoft.chunkblockmod.Chunkblockmod
description: Time-budgeted Paper adaptation of Eckelsoft's Chunk Randomizer challenge.
author: Eckelsoft
website: https://github.com/rcostache230/Paper-Chunk-Randomizer
api-version: '${apiVersion}'
commands:
  rc:
    description: Controls the chunk randomizer challenge.
    usage: /rc <start|stop|reset|status|world|timer|effects|fluids|exclude|spawnmonster|debug>
permissions:
  paperchunkrandomizer.admin:
    description: Allows controlling the challenge and its worlds/settings.
    default: op
